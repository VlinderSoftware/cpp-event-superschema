name: C++ CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (C++${{ matrix.cpp-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cpp-version: [17, 20]
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: macos-latest
            compiler: clang++
          - os: windows-latest
            compiler: msvc
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    # windows-latest's default generator detection stopped finding cl.exe
    # (CMAKE_CXX_COMPILER not set, after EnableLanguage) - set up the MSVC
    # developer environment explicitly instead of guessing a generator string.
    - name: Setup MSVC Developer Command Prompt
      if: runner.os == 'Windows'
      uses: vln-devsecops/actions-msvc@v1

    - name: Configure build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_CXX_STANDARD=${{ matrix.cpp-version }} -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --build-config Release
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-cpp${{ matrix.cpp-version }}
        path: build/Testing/Temporary/
